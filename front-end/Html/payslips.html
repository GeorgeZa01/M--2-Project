<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <style>
    body {
      background-color: #2D3E7B;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .navbar {
      background-color: #1A2653;
    }
    .navbar a {
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: auto;
    }
    .table th, .table td {
      color: #1A2653;
      background-color: white;
    }
    .payslip {
      border: 2px solid #ccc;
      background: #1A2653;
      color: white;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    footer {
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Modern Tech Solutions</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="../Html/Hr.html">Attendance</a></li>
            <li class="nav-item"><a class="nav-link" href="../Html/employeeinfo.html">Employee Info</a></li>

            <li class="nav-item"><a class="nav-link" href="../index.html">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <br>
  <div class="container">
    <h1 class="text-center">Payroll Management System</h1>
    <div class="table-responsive">
      <table id="tableId" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Hours Worked</th>
            <th>Leave Deductions</th>
            <th>Final Salary</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payrollTable"></tbody>
      </table>
    </div>
    <div id="payslip" class="payslip">
      <h3>Payslip</h3>
      <div id="payslipContent">
      </div>
      <button class="btn btn-primary" onclick="Pay()">Pay</button>
    </div>
  </div>
