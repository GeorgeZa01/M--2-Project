<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<style>
    #nav .container-fluid,
    .bg-body-tertiary {
        background-color: #1a2653;
        color: white;
        padding: 0px;
    }

    #nav a {
        color: white;
    }

    .navbar-toggler-icon {
        background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba(255, 255, 255, 1)' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
        border: white;
    }

    .navbar-toggler {
        color: #ffffff;
    }

    header {
        background-color: #1a2653;
        padding: 5px;
        border: white 2px solid;
        border-top: none;
        border-left: none;
        border-right: none;
    }

    body {
        color: #fff;
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
    }

    .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
    }

    .card {
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
        text-align: left;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
        margin: 0;
        color: #1a2653;
    }

    .form-container {
        margin-top: 40px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
        color: #1a2653;
        margin-bottom: 20px;
    }

    .form-container input,
    .form-container button {
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .form-container button {
        background-color: #1a2653;
        color: white;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .form-container button:hover {
        background-color: #9173da;
    }

    @media (max-width: 768px) {
        .cards-container {
            grid-template-columns: 1fr;
        }

        .form-container {
            margin: 0 10px;
        }
    }
</style>

<body>
    <header>
        <nav id="nav" class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Modern Tech Solutions</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                    aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span id="ham" class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarText">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="../Html/attendance_leave.html">Attendance</a></li>
                        <li class="nav-item"><a class="nav-link" href="../employees.html">Employee Information</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Html/payslips.html">Payroll</a></li>
                        <li class="nav-item"><a class="nav-link" href="../Html/performance.html">Employee Review</a></li>
                        <li class="nav-item"><a class="nav-link" href="../index.html">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Employee Information</h1>
        <div id="employee-cards" class="cards-container"></div>

        <div class="form-container">
            <h2>Add New Employee</h2>
            <form id="add-employee-form">
                <input type="text" id="employee_id" placeholder="Employee ID" required>
                <input type="text" id="name" placeholder="Name" required>
                <input type="text" id="position" placeholder="Position" required>
                <input type="text" id="department" placeholder="Department" required>
                <input type="number" id="salary" placeholder="Salary" required>
                <input type="text" id="employment_history" placeholder="Employment History" required>
                <input type="email" id="contact" placeholder="Contact Email" required>
                <button type="submit">Add Employee</button>
            </form>
        </div>
    </div>

    <script src="../Frontend/employeeinfo.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
